name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e ./gateway
          pip install ruff mypy
      - name: Lint
        run: ruff check src tests gateway/src gateway/tests scripts examples
      - name: Type check
        run: mypy src/device_control gateway/src/device_gateway --ignore-missing-imports
      - name: Unit, integration and security tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t device-control:ci .
      - name: Build gateway image
        run: docker build -f gateway/Dockerfile -t device-gateway:ci .
      - name: Verify non-root
        run: |
          docker run --rm --entrypoint id device-control:ci
          docker run --rm --entrypoint id device-gateway:ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e ".[test]" -e ./gateway
      - name: Bandit (subprocess usage reviewed in DC-004)
        run: bandit -c .bandit -r src gateway/src
      - name: Dependency audit
        run: pip-audit
