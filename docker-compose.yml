services:
  device-control:
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      DEVICE_CONTROL_ENV: ${DEVICE_CONTROL_ENV:-local}
      DEVICE_CONTROL_DB: /data/device-control.sqlite3
      DEVICE_CONTROL_EVIDENCE_DIR: /data/evidence
      DEVICE_CONTROL_REQUIRE_HTTPS: ${DEVICE_CONTROL_REQUIRE_HTTPS:-false}
      DEVICE_CONTROL_ADMIN_TOKEN: ${DEVICE_CONTROL_ADMIN_TOKEN:-}
      MINDOS_IDENTITY_HMAC_KEY: ${MINDOS_IDENTITY_HMAC_KEY:-}
      MINDOS_IDENTITY_ISSUER: ${MINDOS_IDENTITY_ISSUER:-}
      DEVICE_CONTROL_MANIFEST_HMAC_KEY: ${DEVICE_CONTROL_MANIFEST_HMAC_KEY:-}
      DEVICE_CONTROL_REDACTION_HMAC_KEY: ${DEVICE_CONTROL_REDACTION_HMAC_KEY:-}
      DEVICE_CONTROL_EVIDENCE_BACKEND: ${DEVICE_CONTROL_EVIDENCE_BACKEND:-local}
    ports:
      - "8085:8085"
    volumes:
      - device-control-data:/data

  device-gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      - device-control
    environment:
      DEVICE_CONTROL_URL: http://device-control:8085
      DEVICE_GATEWAY_ENV: dev
      DEVICE_GATEWAY_ALLOW_INSECURE_HTTP: "1"
      DEVICE_GATEWAY_ID: ${DEVICE_GATEWAY_ID:-dev-gateway}
      DEVICE_GATEWAY_CREDENTIAL: ${DEVICE_GATEWAY_CREDENTIAL:?run scripts/bootstrap_gateway.py first}
      DEVICE_GATEWAY_ADAPTER: ${DEVICE_GATEWAY_ADAPTER:-fake}
      DEVICE_GATEWAY_DB: /data/gateway-ledger.sqlite3
      DEVICE_GATEWAY_ALLOWED_APPS: ${DEVICE_GATEWAY_ALLOWED_APPS:-com.example.notes}
      DEVICE_GATEWAY_ENDPOINT_ID: ${DEVICE_GATEWAY_ENDPOINT_ID:-phone-1}
      DEVICE_GATEWAY_DEVICE_ID: ${DEVICE_GATEWAY_DEVICE_ID:-device-phone-1}
      DEVICE_GATEWAY_DEVICE_FINGERPRINT: ${DEVICE_GATEWAY_DEVICE_FINGERPRINT:-}
      DEVICE_GATEWAY_MANIFEST_HMAC_KEY: ${DEVICE_GATEWAY_MANIFEST_HMAC_KEY:-}
      DEVICE_GATEWAY_REDACTION_HMAC_KEY: ${DEVICE_GATEWAY_REDACTION_HMAC_KEY:-}
      DEVICE_GATEWAY_REDACTION_KEY_ID: ${DEVICE_GATEWAY_REDACTION_KEY_ID:-dev-local}
      DEVICE_GATEWAY_MANIFEST_REQUIRE_SIGNATURE: "false"
      DEVICE_GATEWAY_PROCESS_ISOLATION: "1"
      DEVICE_GATEWAY_STATE_MAX_AGE_SECONDS: "15"
    volumes:
      - device-gateway-data:/data

volumes:
  device-control-data:
  device-gateway-data:
