[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "device-gateway"
version = "0.1.0"
description = "Out-of-process Device Control gateway and Android ADB adapter"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5", "defusedxml>=0.7,<1", "Pillow>=13,<14", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
