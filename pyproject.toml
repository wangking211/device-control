[project]
name = "device-control"
version = "0.1.0"
description = "Independent, contract-first device management control plane"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "jsonschema>=4.21,<5", "referencing>=0.30,<1", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
pythonpath = ["src", "gateway/src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
